name: Tests

# Run the test suite on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: The employee and employer tools
        run: |
          python3 tests/test_paye.py
          python3 tests/test_vat.py
          python3 tests/test_payroll.py

      - name: The payroll suite
        run: |
          cd payroll-suite
          python3 tests/run_all.py

      - name: The site is well formed
        run: |
          python3 - <<'PY'
          import io, re, sys
          from html.parser import HTMLParser

          VOID = {"area","base","br","col","embed","hr","img","input","link",
                  "meta","param","source","track","wbr","path","rect","circle",
                  "use","stop","ellipse","line"}

          class Check(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack, self.errors = [], []
              def handle_starttag(self, tag, attrs):
                  if tag not in VOID:
                      self.stack.append((tag, self.getpos()))
              def handle_endtag(self, tag):
                  if tag in VOID:
                      return
                  if self.stack and self.stack[-1][0] == tag:
                      self.stack.pop()
                  else:
                      self.errors.append(f"stray </{tag}> {self.getpos()}")

          failures = 0
          for path in ["portfolio/index.html", "payroll-suite/web/index.html"]:
              check = Check()
              check.feed(io.open(path, encoding="utf-8").read())
              for tag, pos in check.stack:
                  check.errors.append(f"unclosed <{tag}> {pos}")
              if check.errors:
                  failures += 1
                  print(f"{path}:")
                  for error in check.errors:
                      print("   ", error)
              else:
                  print(f"{path}: OK")

          # Every id the scripts reach for has to exist in the page.
          html = io.open("portfolio/index.html", encoding="utf-8").read()
          ids = set(re.findall(r'id="([^"]+)"', html))
          main = io.open("portfolio/assets/js/main.js", encoding="utf-8").read()
          missing = [r for r in set(re.findall(r'\$\("#([A-Za-z0-9_-]+)"\)', main))
                     if r not in ids]
          if missing:
              failures += 1
              print("Missing ids:", missing)
          else:
              print("Every id the scripts use exists.")

          sys.exit(1 if failures else 0)
          PY
